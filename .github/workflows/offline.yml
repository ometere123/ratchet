name: offline-core
on:
  push:
  pull_request:
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8.2,<9'
      - run: python scripts/preflight.py
      - run: python -m pytest tests/test_offline.py -q
      - name: Python syntax all deployable contracts
        run: python -m py_compile contracts/ratchet.py contracts/ratchet_consumer_example.py
