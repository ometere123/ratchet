name: offline-core
on:
  push:
  pull_request:
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run cli:version
      - run: npm run network:guard
      - run: python -m pip install 'pytest>=8.2,<9'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/preflight.py
      - run: python -m pytest tests/test_offline.py -q
      - name: Python syntax all deployable contracts
        run: python -m py_compile contracts/ratchet.py contracts/ratchet_consumer_example.py
      - name: GenLayer Direct Mode
        run: gltest direct_tests/test_ratchet_direct.py -q
